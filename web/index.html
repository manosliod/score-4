<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)" data-scheme="light" />
		<meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)" data-scheme="dark" />
		<script>
			{
				let theme = 'system'
				try {
					const stored = localStorage.getItem('theme')
					if (stored === 'light' || stored === 'dark') {
						theme = stored
					}
				} catch {}
				document.documentElement.dataset.theme = theme
				if (theme !== 'system') {
					for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
						meta.setAttribute('media', meta.dataset.scheme === theme ? 'all' : 'not all')
					}
				}
			}
		</script>
		<meta
			name="description"
			content="Score 4: Connect Four for two players, a C++ game core running in the browser."
		/>
		<title>Score 4</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/app/main.tsx"></script>
	</body>
</html>
