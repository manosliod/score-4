name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  no-comments:
    uses: manosliod/dev-tooling/.github/workflows/no-comments.yml@v1.3

  cpp:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - run: pip install -r requirements-tools.txt
      - name: Format check
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')
      - uses: actions/cache@v6
        with:
          path: build/debug/_deps
          key: deps-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        run: cmake --preset debug
      - name: Lint
        run: run-clang-tidy.py -quiet -p build/debug "$PWD/(src|apps|tests)/"
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug
      - name: Release build
        run: cmake --preset release && cmake --build --preset release && ctest --preset release

  web:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.local/emsdk
          key: emsdk-6.0.12-${{ runner.os }}
      - name: Install Emscripten
        run: |
          if [ ! -x ~/.local/emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/.local/emsdk
          fi
          ~/.local/emsdk/emsdk install 6.0.12
          ~/.local/emsdk/emsdk activate 6.0.12
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - run: pip install -r ../requirements-tools.txt
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the engine
        run: source ~/.local/emsdk/emsdk_env.sh && pnpm run engine
        shell: bash
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
